
# This fork ships only libmsquic.so for Android: track the publish workflow's actions and the OpenSSL
# linked into the library. The other pins (Rust, googletest, CLOG, Docker) arrive with upstream merges.
version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    allow:
      - dependency-name: "submodules/openssl"
